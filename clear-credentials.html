<!DOCTYPE html>
<html>
<head>
    <title>Clear Stored Credentials</title>
</head>
<body>
    <h1>Clearing Stored Login Credentials</h1>
    <p>This will clear any stored login credentials from localStorage.</p>
    <button onclick="clearCredentials()">Clear Credentials</button>
    <div id="result"></div>

    <script>
        function clearCredentials() {
            try {
                // Clear all SafeNest related localStorage items
                localStorage.removeItem('temp_login_email');
                localStorage.removeItem('temp_login_password');
                localStorage.removeItem('safenest_user');
                localStorage.removeItem('safenest_token');
                
                document.getElementById('result').innerHTML = 
                    '<p style="color: green;">✅ All stored credentials cleared successfully!</p>' +
                    '<p>You can now close this page and try logging in with the correct credentials.</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<p style="color: red;">❌ Error clearing credentials: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
